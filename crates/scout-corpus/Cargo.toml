[package]
name = "scout-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Corpus engine: registry, adapters, normalisation, tokeniser, passages and FTS index (Scout family)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
regex.workspace = true
sha1.workspace = true
scout-index = { path = "../scout-index" }
scout-query = { path = "../scout-query" }
toml.workspace = true
dirs.workspace = true
unicode-segmentation.workspace = true
unicode-normalization.workspace = true
globset.workspace = true
walkdir.workspace = true
percent-encoding.workspace = true
chrono.workspace = true
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# The real in-process ONNX embedder (fastembed). Off by default: apps opt in.
onnx = ["dep:fastembed"]

[dev-dependencies]
tempfile.workspace = true
